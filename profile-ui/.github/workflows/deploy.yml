name: Firebase Deploy

on:
  workflow_dispatch: # manual trigger only — no auto deploy on push

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
      VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
      VITE_AUTH0_CALLBACK_URL: ${{ secrets.VITE_AUTH0_CALLBACK_URL }}
      VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
      VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci && npm ci --prefix server

      - name: Validate production configuration
        run: node scripts/prepare-release.mjs

      - name: Verify release
        run: npm run verify

      - name: Check dependency vulnerabilities
        run: npm audit --audit-level=moderate && npm audit --prefix server --audit-level=moderate

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Test production UI
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BUILD: "1"

      - name: Verify Hosting and private resume routing
        run: npm run test:hosting

      - name: Deploy to Firebase
        run: npx firebase-tools@15.28.1 deploy --only functions:portfolio-resume,hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Verify deployed public routes and resume access control
        run: node scripts/smoke-release.mjs
        env:
          SITE_URL: https://sravanasparimi.com
