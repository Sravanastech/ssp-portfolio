name: Deploy hosting

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless Google auth (Workload Identity Federation)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: profile-ui/package-lock.json
      - run: npm ci
        working-directory: profile-ui
      - run: npm run build:release
        working-directory: profile-ui
        env:
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_CALLBACK_URL: ${{ secrets.VITE_AUTH0_CALLBACK_URL }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ secrets.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ secrets.VITE_BING_SITE_VERIFICATION }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/132779291429/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-hosting@ssp-profile.iam.gserviceaccount.com
      - run: npx --yes firebase-tools@15.34.1 deploy --only hosting --project ssp-profile --non-interactive
        working-directory: profile-ui
      # Notify Bing/Yandex of the sitemap URLs; the script is a no-op when the secret is absent.
      - run: node scripts/indexnow.mjs --submit
        working-directory: profile-ui
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
