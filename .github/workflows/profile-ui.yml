name: Profile UI CI
on:
  push:
    branches: [main]
    paths: ["profile-ui/**", ".github/workflows/profile-ui.yml"]
  pull_request:
    branches: [main]
    paths: ["profile-ui/**", ".github/workflows/profile-ui.yml"]
jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: profile-ui
    env:
      # Synthetic public SPA configuration: fork PRs need no production secrets.
      VITE_AUTH0_DOMAIN: portfolio-tests.auth0.com
      VITE_AUTH0_CLIENT_ID: portfolio-tests
      VITE_AUTH0_CALLBACK_URL: http://127.0.0.1:5173/auth-callback
      VITE_AUTH0_AUDIENCE: https://portfolio-tests.example/api
      VITE_WEB3FORMS_ACCESS_KEY: test-only-not-a-delivery-key
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: profile-ui/package-lock.json

      - name: Clean install dependencies
        run: npm ci

      - name: Check formatting, lint, tests and production build
        run: npm run verify

      - name: Check for Vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Test production UI
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BUILD: "1"
