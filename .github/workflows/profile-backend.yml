name: Profile application CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: profile-backend/pom.xml
      - run: ./mvnw -B verify
        working-directory: profile-backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: profile-ui/package-lock.json
      - run: npm ci
        working-directory: profile-ui
      - run: npm run lint && npm run test:run && VITE_CONTENT_MODE=api npm run build
        working-directory: profile-ui
