version: 2
updates:
  - package-ecosystem: npm
    directory: /profile-ui
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: maven
    directory: /profile-backend
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
