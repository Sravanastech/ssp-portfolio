name: profile-backend-prod
services:
  api:
    image: ${PROFILE_IMAGE:?Set an immutable reviewed image digest}
    profiles: [production]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PROFILE_RENDERER_SCRIPT: /app/ui/scripts/render-snapshot.mjs
      PROFILE_RENDERER_BUNDLE: /app/ui/dist/renderer/prerender.mjs
      PROFILE_STATIC_INDEX: /app/ui/dist/index.html
    secrets:
      - {source: db_url, target: DB_URL}
      - {source: db_username, target: DB_USERNAME}
      - {source: db_password, target: DB_PASSWORD}
      - {source: auth_issuer, target: AUTH_ISSUER}
      - {source: auth_audience, target: AUTH_AUDIENCE}
      - {source: email_endpoint, target: EMAIL_ENDPOINT}
      - {source: email_key, target: EMAIL_KEY}
      - {source: email_recipient, target: EMAIL_RECIPIENT}
      - {source: email_from, target: EMAIL_FROM}
    volumes:
      - profile_media:/var/lib/profile/media
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  profile_media:
secrets:
  db_url: {file: ./secrets/DB_URL}
  db_username: {file: ./secrets/DB_USERNAME}
  db_password: {file: ./secrets/DB_PASSWORD}
  auth_issuer: {file: ./secrets/AUTH_ISSUER}
  auth_audience: {file: ./secrets/AUTH_AUDIENCE}
  email_endpoint: {file: ./secrets/EMAIL_ENDPOINT}
  email_key: {file: ./secrets/EMAIL_KEY}
  email_recipient: {file: ./secrets/EMAIL_RECIPIENT}
  email_from: {file: ./secrets/EMAIL_FROM}
