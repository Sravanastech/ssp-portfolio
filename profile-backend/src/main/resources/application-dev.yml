spring:
  datasource:
    url: jdbc:postgresql://localhost:55432/profile_dev
    username: profile_runtime
    password: ${DB_RUNTIME_PASSWORD}
  flyway:
    user: profile_migrator
    password: ${DB_MIGRATION_PASSWORD}
profile:
  renderer:
    script: ../profile-ui/scripts/render-snapshot.mjs
    bundle: ${PROFILE_RENDERER_BUNDLE:../profile-ui/dist/renderer/prerender.mjs}
    template: ${PROFILE_STATIC_INDEX:../profile-ui/dist/index.html}
  email:
    mode: capture
  resume-otp:
    enabled: true
    trusted-proxy-hops: 1
    secret: ${OTP_SECRET:dev-only-otp-secret-change-me-0123456789}
    turnstile:
      enabled: true
      secret: ${TURNSTILE_SECRET:1x0000000000000000000000000000000AA}
      allowed-hostnames: example.com,localhost
      require-action: false
